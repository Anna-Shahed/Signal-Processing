[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-processing"
version = "0.1.0"
description = "Signal Processing Laboratory API, MCP server, and Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.37",
    "plotly>=5.22",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
mcp = [
    "mcp[cli]>=1.3",
]
all = [
    "streamlit>=1.37",
    "plotly>=5.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp[cli]>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
