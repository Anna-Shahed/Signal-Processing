[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-processing"
version = "0.1.0"
description = "Signal Processing Laboratory API, MCP server, and Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4",
    "scipy>=1.16",
    "matplotlib>=3.10",
    "plotly>=5.22",
    "PyWavelets>=1.7",
    "soundfile>=0.12",
    "streamlit>=1.37",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
mcp = ["mcp[cli]>=1.3"]
test = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5", "ruff>=0.6"]
all = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp[cli]>=1.3",
]

[project.scripts]
signal-process = "signal_processing.cli.main:main"
signal-process-api = "signal_processing.api:main"
signal-process-mcp = "signal_processing.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
