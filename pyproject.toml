[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-processing"
version = "0.1.0"
description = "Signal Processing Laboratory API, MCP server, and Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
mcp = [
    "mcp>=1.0.0",
]
ui = [
    "streamlit>=1.28.0",
    "plotly>=5.15.0",
]
all = [
    "signal-processing[api,mcp,ui]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
