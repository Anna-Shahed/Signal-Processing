[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-processing"
version = "0.1.0"
description = "Signal Processing Laboratory API, MCP server, and Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.dependencies]
numpy = ">=2.4"
scipy = ">=1.16"
matplotlib = ">=3.10"
plotly = ">=5.22"
PyWavelets = ">=1.7"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
